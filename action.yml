name: "rbit run"
description: >-
  Run the rbit AI coding agent headless on a task inside your workflow
  and collect its JSONL event stream as an artifact.
author: "DreyzeDev"

branding:
  icon: "terminal"
  color: "blue"

inputs:
  task:
    description: "Task for rbit to perform, e.g. 'fix the failing test in tests/test_app.py'."
    required: true
  model:
    description: "Model ID override passed to `rbit run -m` (OpenRouter / OpenAI / DeepSeek / Ollama). Optional."
    required: false
    default: ""

outputs:
  output-file:
    description: "Path to the JSONL event stream produced by rbit."
    value: rbit-output.jsonl

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install rbit
      shell: bash
      env:
        RBIT_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$RBIT_ACTION_PATH"

    # The agent reads RBIT_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY from the
    # environment, or falls back to the built-in offline smart-local agent.
    # A composite action cannot read the caller's secrets itself, so pass the key
    # as an environment variable on the step that uses this action:
    #   - uses: DreyzeDev/rbit@<ref>
    #     with: { task: "..." }
    #     env:
    #       RBIT_API_KEY: ${{ secrets.RBIT_API_KEY }}
    # (`secrets: inherit` only exists for reusable workflows, not for actions.)
    # The task text may come from untrusted input (an issue or PR body): the agent
    # runs shell commands, so only pass trusted text or run it without secrets.
    - name: Run rbit
      shell: bash
      env:
        RBIT_TASK: ${{ inputs.task }}
        RBIT_MODEL: ${{ inputs.model }}
      run: |
        set -o pipefail
        args=(run --output-format jsonl)
        if [ -n "$RBIT_MODEL" ]; then
          args+=(-m "$RBIT_MODEL")
        fi
        rbit "${args[@]}" -- "$RBIT_TASK" | tee rbit-output.jsonl

    - name: Upload rbit output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rbit-output
        path: rbit-output.jsonl
