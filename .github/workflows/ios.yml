name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Rbit
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Rbit.xcodeproj \
            -scheme Rbit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=2 \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Rbit.app Payload/
          zip -qr rbit-unsigned.ipa Payload
          ls -lh rbit-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rbit-unsigned-ipa
          path: ios/rbit-unsigned.ipa
          if-no-files-found: error
