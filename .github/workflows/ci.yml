name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (fatal rules only)
        run: ruff check rbit tests --select E9,F63,F7,F82,B023,B905,B007

      - name: Mypy
        run: python -m mypy

      - name: CLI smoke
        run: |
          python -m pip install --no-deps .
          rbit --version
          python -m rbit --version
          python -m rbit --generate-completion bash > /dev/null

      - name: Tests
        run: pytest -q

  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -m pip install --no-deps . && rbit --version
      - run: python -m rbit --version
      - run: python -m rbit config list
      - run: python -m rbit permissions list
      - run: python -m rbit sandbox status
      - run: python -m rbit sandbox check
      - run: pytest tests/test_fix_core.py tests/test_long_horizon.py tests/test_fix_sandbox.py tests/test_sandbox_isolation.py -q