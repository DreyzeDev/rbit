<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="rbit — Next-Gen Terminal AI Coding Agent">
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1d1d1d"/>
    </pattern>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fab283" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fab283" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fab283" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="termclip">
      <rect x="524" y="34" width="652" height="344" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" fill="#141414"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Left: wordmark + tagline -->
  <text x="60" y="130" font-family="Consolas, 'Cascadia Code', monospace" font-size="64" font-weight="bold" fill="#eeeeee">rbit</text>
  <rect x="185" y="92" width="14" height="14" fill="#fab283"/>
  <text x="60" y="172" font-family="Consolas, 'Cascadia Code', monospace" font-size="19" fill="#fab283">Next-Gen Terminal AI Coding Agent</text>
  <rect x="60" y="192" width="380" height="2" fill="url(#accentline)"/>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="15" fill="#9a9a9a">
    <text x="60" y="234">▸ Streaming: reasoning, tool-карточки, diff</text>
    <text x="60" y="262">▸ Checkpoints · субагенты · макросы · watch</text>
    <text x="60" y="290">▸ CLI + desktop-приложение + HTTP API</text>
    <text x="60" y="318">▸ Локально · приватно · работает без ключей</text>
  </g>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="13">
    <rect x="60" y="344" width="86" height="26" rx="13" fill="none" stroke="#2f2f2f"/>
    <text x="76" y="362" fill="#7fd88f">pip install</text>
    <rect x="154" y="344" width="70" height="26" rx="13" fill="none" stroke="#2f2f2f"/>
    <text x="168" y="362" fill="#c8c8c8">rbit</text>
    <rect x="232" y="344" width="120" height="26" rx="13" fill="none" stroke="#2f2f2f"/>
    <text x="246" y="362" fill="#808080">v1.3.0 · MIT</text>
  </g>

  <!-- Right: terminal frame with the real session screenshot -->
  <g>
    <rect x="512" y="22" width="676" height="368" rx="14" fill="#0d0d0d" stroke="#2f2f2f"/>
    <circle cx="536" cy="40" r="5" fill="#e06c75"/>
    <circle cx="552" cy="40" r="5" fill="#e5c07b"/>
    <circle cx="568" cy="40" r="5" fill="#7fd88f"/>
    <text x="850" y="45" font-family="Consolas, 'Cascadia Code', monospace" font-size="13" fill="#8a8a8a" text-anchor="middle">rbit</text>
    <g clip-path="url(#termclip)">
      <image href="../screenshots/session.svg" x="524" y="58" width="652" height="344" preserveAspectRatio="xMidYMin slice"/>
    </g>
  </g>
</svg>
