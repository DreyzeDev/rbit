<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>rbit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <div id="brand">rbit <span id="ws"></span></div>
    <button id="new-session">＋ New session</button>
    <div id="session-list"></div>
    <div id="backend-status"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <span id="hdr-title">rbit</span>
      <span id="hdr-stats"></span>
    </header>
    <div id="feed">
      <div class="empty" id="empty">Спроси что-нибудь — агент читает, правит файлы и запускает команды в воркспейсе.</div>
    </div>
    <div id="composer">
      <textarea id="prompt" rows="3" placeholder="Ask anything…  (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button id="send">Send</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
