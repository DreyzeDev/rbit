<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>rbit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="tabbar">
    <button id="menu-btn" title="Sessions">☰</button>
    <div id="tabs"></div>
    <button id="tab-new" title="New session">＋</button>
  </div>
  <div id="layout">
    <aside id="sessions" class="hidden">
      <div id="sessions-list"></div>
    </aside>
    <main id="main">
      <div id="feed">
        <div class="wordmark">rbit</div>
      </div>
      <div id="composer-wrap">
        <div id="composer-card">
          <textarea id="prompt" rows="1" placeholder="Спросите что угодно, / — команды, @ — контекст..."></textarea>
          <div id="composer-bar">
            <span class="ghost" id="btn-mode">Build</span>
            <span class="dot">·</span>
            <span class="ghost" id="btn-model">GLM 5.3 Flash</span>
            <span class="spacer"></span>
            <button id="send" title="Send">↑</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
